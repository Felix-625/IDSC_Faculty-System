openapi: 3.0.3

info:
  title: IDSC Portal - Faculty System API
  description: >
    PI for the IDSC Portal Faculty System.

    The system allows faculty members to:
    - View their assigned subjects and sections
    - View students enrolled in their assigned subjects
    - Manage student grades
    - Manage student attendance
    - View schedules
    - View announcements

    Dean users have authorization to manage:
    - Faculty
    - Courses
    - Subjects
    - Sections
    - Faculty subject assignments
    - Class Schedules
    - Announcements
    - Student grades
    - Student attendance.
  version: 1.3.0

  license:
    name: Academic Project License
servers:
- url: http://localhost:5000/api/v1
  description: Local development server


# =============================================================================
# PATHS
# =============================================================================

paths:

  # ===========================================================================
  # HEALTH CHECK
  # ===========================================================================

  /health:
    get:
      tags:
      - Health
      summary: API health check
      description: Returns the current health status of the API.
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                    example: ok
              example:
                status: ok

  # ===========================================================================
  # FACULTY MANAGEMENT
  # ===========================================================================

        '400':
          $ref: '#/components/responses/BadRequest'
      operationId: getHealth
      security: []
  /faculty:
    get:
      tags:
      - Faculty Management
      summary: Get all faculty members
      x-roles:
      - DEAN
      security:
      - bearerAuth: []
      responses:
        '200':
          description: List of faculty members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FacultyItem'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '500':
          $ref: '#/components/responses/InternalServerError'


      operationId: getFaculty
    post:
      tags:
      - Faculty Management
      summary: Add a new faculty member
      x-roles:
      - DEAN
      description: Allows an authorized Dean to add a new faculty member.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewFacultyPayload'
      responses:
        '201':
          description: Faculty member successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacultyItem'

        '400':
          $ref: '#/components/responses/BadRequest'

        '403':
          $ref: '#/components/responses/Forbidden'


      operationId: createFaculty
  /faculty/{facultyId}:
    get:
      tags:
      - Faculty Management
      summary: Get faculty member by ID
      x-roles:
      - DEAN
      - FACULTY
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/FacultyId'
      responses:
        '200':
          description: Faculty information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacultyItem'

        '404':
          $ref: '#/components/responses/NotFound'


      operationId: getFacultyById
    put:
      tags:
      - Faculty Management
      summary: Update faculty information
      x-roles:
      - DEAN
      description: >
        Allows an authorized Dean to update faculty information,
        including employment status.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/FacultyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewFacultyPayload'
      responses:
        '200':
          description: Faculty information successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacultyItem'

        '400':
          $ref: '#/components/responses/BadRequest'

        '403':
          $ref: '#/components/responses/Forbidden'

        '404':
          $ref: '#/components/responses/NotFound'


  # ===========================================================================
  # FACULTY SALARY
  # ===========================================================================

      operationId: updateFaculty
  /faculty/{facultyId}/salary:
    get:
      tags:
      - Faculty Salary
      summary: Get faculty salary
      x-roles:
      - DEAN
      - FACULTY
      description: >
        Returns salary information based on the faculty member's
        employment type.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/FacultyId'
      responses:
        '200':
          description: Faculty salary information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalaryItem'

        '404':
          $ref: '#/components/responses/NotFound'


  # ===========================================================================
  # FACULTY SUBJECT ASSIGNMENTS
  # ===========================================================================

      operationId: getFacultySalary
  /faculty/{facultyId}/subjects:
    get:
      tags:
      - Faculty Subject Assignments
      summary: Get subjects assigned to faculty
      x-roles:
      - DEAN
      - FACULTY
      description: >
        Returns all subject assignments of a specific faculty member.
        Each assignment represents a specific subject, section, semester,
        and academic year.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/FacultyId'
      responses:
        '200':
          description: List of subjects assigned to the faculty
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssignedSubjectItem'

        '404':
          $ref: '#/components/responses/NotFound'


      operationId: getFacultySubjects
    post:
      tags:
      - Faculty Subject Assignments
      summary: Assign a subject to faculty
      x-roles:
      - DEAN
      description: >
        Allows an authorized Dean to assign a subject/course to a faculty
        member. The subject must already exist in the course management system.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/FacultyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignSubjectPayload'
      responses:
        '201':
          description: Subject successfully assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignedSubjectItem'

        '400':
          $ref: '#/components/responses/BadRequest'

        '403':
          $ref: '#/components/responses/Forbidden'

        '404':
          $ref: '#/components/responses/NotFound'

        '409':
          description: Subject is already assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


      operationId: assignFacultySubject
  /faculty/{facultyId}/subjects/{courseCode}:
    delete:
      tags:
      - Faculty Subject Assignments
      summary: Remove assigned subject from faculty
      x-roles:
      - DEAN
      description: >
        Removes the faculty assignment. This does not delete the course.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/FacultyId'
      - $ref: '#/components/parameters/CourseCode'
      responses:
        '204':
          description: Subject assignment successfully removed

        '403':
          $ref: '#/components/responses/Forbidden'

        '404':
          $ref: '#/components/responses/NotFound'


  # ===========================================================================
  # COURSE MANAGEMENT
  # ===========================================================================

      operationId: removeFacultySubject
  /courses:
    get:
      tags:
      - Course Management
      summary: Get all courses
      x-roles:
      - DEAN
      - FACULTY
      security:
      - bearerAuth: []
      responses:
        '200':
          description: List of courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CourseItem'


        '400':
          $ref: '#/components/responses/BadRequest'
      operationId: getCourses
    post:
      tags:
      - Course Management
      summary: Create a new course
      x-roles:
      - DEAN
      description: Allows an authorized Dean to create a new course.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewCoursePayload'
      responses:
        '201':
          description: Course successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseItem'

        '400':
          $ref: '#/components/responses/BadRequest'

        '403':
          $ref: '#/components/responses/Forbidden'


      operationId: createCourse
  /courses/{courseCode}:
    get:
      tags:
      - Course Management
      summary: Get course by code
      x-roles:
      - DEAN
      - FACULTY
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CourseCode'
      responses:
        '200':
          description: Course information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseItem'

        '404':
          $ref: '#/components/responses/NotFound'


      operationId: getCourseByCode
    put:
      tags:
      - Course Management
      summary: Update course
      x-roles:
      - DEAN
      description: Allows an authorized Dean to update course information.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CourseCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewCoursePayload'
      responses:
        '200':
          description: Course successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseItem'

        '400':
          $ref: '#/components/responses/BadRequest'

        '403':
          $ref: '#/components/responses/Forbidden'

        '404':
          $ref: '#/components/responses/NotFound'


      operationId: updateCourse
    delete:
      tags:
      - Course Management
      summary: Delete course
      x-roles:
      - DEAN
      description: >
        Removes a course. For courses with historical records,
        marking the course INACTIVE is recommended.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CourseCode'
      responses:
        '204':
          description: Course successfully deleted

        '403':
          $ref: '#/components/responses/Forbidden'

        '404':
          $ref: '#/components/responses/NotFound'


  # ===========================================================================
  # FACULTY COURSES
  # ===========================================================================

      operationId: deleteCourse
  /faculty/{facultyId}/courses:
    get:
      tags:
      - Course Management
      summary: Get courses assigned to faculty
      x-roles:
      - DEAN
      - FACULTY
      description: >
        Returns all course assignments of the faculty member.
        Assignment information includes section, semester,
        and academic year.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/FacultyId'
      responses:
        '200':
          description: Faculty course assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FacultyCourseItem'

        '404':
          $ref: '#/components/responses/NotFound'


  # ===========================================================================
  # ENROLLED STUDENTS
  # ===========================================================================

      operationId: getFacultyCourses
  /faculty/{facultyId}/courses/{courseCode}/students:
    get:
      tags:
      - Enrolled Students
      summary: Get students enrolled in assigned subject
      x-roles:
      - DEAN
      - FACULTY
      description: >
        Returns students enrolled in the specific subject assignment
        handled by the faculty member.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/FacultyId'
      - $ref: '#/components/parameters/CourseCode'
      - $ref: '#/components/parameters/Section'
      - $ref: '#/components/parameters/Semester'
      - $ref: '#/components/parameters/AcademicYear'
      responses:
        '200':
          description: List of enrolled students
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudentItem'

        '404':
          $ref: '#/components/responses/NotFound'


  # ===========================================================================
  # STUDENT GRADES
  # ===========================================================================

      operationId: getEnrolledStudents
  /faculty/{facultyId}/courses/{courseCode}/students/{studentId}/grade:
    post:
      tags:
      - Student Grades
      summary: Add student grade
      x-roles:
      - DEAN
      - FACULTY
      description: >
        Adds a grade for a student enrolled in the specific faculty
        subject assignment.

        The assignmentId identifies the exact subject offering being graded.
        This prevents a grade from being attached only to a generic course.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/FacultyId'
      - $ref: '#/components/parameters/CourseCode'
      - $ref: '#/components/parameters/StudentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GradePayload'
            example:
              assignmentId: "ASG-001"
              grade: 1.75
      responses:
        '201':
          description: Grade successfully added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GradeItem'

        '400':
          $ref: '#/components/responses/BadRequest'

        '404':
          $ref: '#/components/responses/NotFound'

        '409':
          description: Grade already exists for this student and subject assignment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


      operationId: createStudentGrade
    put:
      tags:
      - Student Grades
      summary: Update student grade
      x-roles:
      - DEAN
      - FACULTY
      description: >
        Updates the grade of a student for a specific faculty
        subject assignment.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/FacultyId'
      - $ref: '#/components/parameters/CourseCode'
      - $ref: '#/components/parameters/StudentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GradePayload'
            example:
              assignmentId: "ASG-001"
              grade: 1.50
      responses:
        '200':
          description: Grade successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GradeItem'

        '400':
          $ref: '#/components/responses/BadRequest'

        '404':
          $ref: '#/components/responses/NotFound'


      operationId: updateStudentGrade
    get:
      tags:
      - Student Grades
      summary: Get student grade for assigned subject
      x-roles:
      - DEAN
      - FACULTY
      description: >
        Returns the student's grade for a specific faculty subject assignment.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/FacultyId'
      - $ref: '#/components/parameters/CourseCode'
      - $ref: '#/components/parameters/StudentId'
      responses:
        '200':
          description: Student grade
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GradeItem'

        '404':
          $ref: '#/components/responses/NotFound'


  # ===========================================================================
  # GRADES FOR A COMPLETE SUBJECT
  # ===========================================================================

      operationId: getStudentGrade
  /faculty/{facultyId}/subjects/{assignmentId}/grades:
    get:
      tags:
      - Student Grades
      summary: Get all student grades for a subject assignment
      x-roles:
      - DEAN
      - FACULTY
      description: >
        Returns all grades for students enrolled in a specific faculty
        subject assignment.

        The assignmentId connects the grades directly to the faculty's
        assigned subject, section, semester, and academic year.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/FacultyId'
      - $ref: '#/components/parameters/AssignmentId'
      responses:
        '200':
          description: List of grades for the assigned subject
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GradeItem'

        '404':
          $ref: '#/components/responses/NotFound'


  # ===========================================================================
  # CLASS SCHEDULE MANAGEMENT
  # ===========================================================================

      operationId: getAssignmentGrades
  /schedules:
    get:
      tags:
      - Class Schedules
      summary: Get all class schedules
      x-roles:
      - DEAN
      security:
      - bearerAuth: []
      responses:
        '200':
          description: List of class schedules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScheduleItem'


        '400':
          $ref: '#/components/responses/BadRequest'
      operationId: getSchedules
    post:
      tags:
      - Class Schedules
      summary: Create class schedule
      x-roles:
      - DEAN
      description: Allows an authorized Dean to create a class schedule.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchedulePayload'
      responses:
        '201':
          description: Schedule successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleItem'

        '400':
          $ref: '#/components/responses/BadRequest'

        '403':
          $ref: '#/components/responses/Forbidden'


      operationId: createSchedule
  /schedules/{scheduleId}:
    get:
      tags:
      - Class Schedules
      summary: Get schedule by ID
      x-roles:
      - DEAN
      - FACULTY
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ScheduleId'
      responses:
        '200':
          description: Schedule information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleItem'

        '404':
          $ref: '#/components/responses/NotFound'


      operationId: getScheduleById
    put:
      tags:
      - Class Schedules
      summary: Update class schedule
      x-roles:
      - DEAN
      description: Allows an authorized Dean to update a class schedule.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ScheduleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchedulePayload'
      responses:
        '200':
          description: Schedule successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleItem'

        '400':
          $ref: '#/components/responses/BadRequest'

        '403':
          $ref: '#/components/responses/Forbidden'

        '404':
          $ref: '#/components/responses/NotFound'


      operationId: updateSchedule
  /faculty/{facultyId}/schedule:
    get:
      tags:
      - Class Schedules
      summary: Get faculty schedule
      x-roles:
      - DEAN
      - FACULTY
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/FacultyId'
      responses:
        '200':
          description: Faculty teaching schedule
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScheduleItem'

        '404':
          $ref: '#/components/responses/NotFound'


  # ===========================================================================
  # ANNOUNCEMENTS
  # ===========================================================================

      operationId: getFacultySchedule
  /announcements:
    get:
      tags:
      - Announcements
      summary: Get all announcements
      x-roles:
      - DEAN
      - FACULTY
      security:
      - bearerAuth: []
      responses:
        '200':
          description: List of announcements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AnnouncementItem'


        '400':
          $ref: '#/components/responses/BadRequest'
      operationId: getAnnouncements
    post:
      tags:
      - Announcements
      summary: Create announcement
      x-roles:
      - DEAN
      description: Allows an authorized Dean to create an announcement.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnnouncementPayload'
      responses:
        '201':
          description: Announcement successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementItem'

        '400':
          $ref: '#/components/responses/BadRequest'

        '403':
          $ref: '#/components/responses/Forbidden'


      operationId: createAnnouncement
  /announcements/{announcementId}:
    get:
      tags:
      - Announcements
      summary: Get announcement by ID
      x-roles:
      - DEAN
      - FACULTY
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/AnnouncementId'
      responses:
        '200':
          description: Announcement information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementItem'

        '404':
          $ref: '#/components/responses/NotFound'


      operationId: getAnnouncementById
    put:
      tags:
      - Announcements
      summary: Update announcement
      x-roles:
      - DEAN
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/AnnouncementId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnnouncementPayload'
      responses:
        '200':
          description: Announcement successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementItem'

        '400':
          $ref: '#/components/responses/BadRequest'

        '403':
          $ref: '#/components/responses/Forbidden'

        '404':
          $ref: '#/components/responses/NotFound'


      operationId: updateAnnouncement
    delete:
      tags:
      - Announcements
      summary: Delete announcement
      x-roles:
      - DEAN
      description: Allows an authorized Dean to delete an announcement.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/AnnouncementId'
      responses:
        '204':
          description: Announcement successfully deleted

        '403':
          $ref: '#/components/responses/Forbidden'

        '404':
          $ref: '#/components/responses/NotFound'


# =============================================================================
# COMPONENTS
# =============================================================================

      operationId: deleteAnnouncement
components:

  # ===========================================================================
  # AUTHENTICATION
  # ===========================================================================

  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        JWT authentication identifies the logged-in faculty member
        and determines their role and permissions.


  # ===========================================================================
  # PARAMETERS
  # ===========================================================================

  parameters:

    FacultyId:
      name: facultyId
      in: path
      required: true
      description: Unique ID of the faculty member.
      schema:
        type: string
        example: "FAC-2026-001"


    CourseCode:
      name: courseCode
      in: path
      required: true
      description: Unique code of the subject/course.
      schema:
        type: string
        example: "IT303"


    AssignmentId:
      name: assignmentId
      in: path
      required: true
      description: >
        Unique ID of the faculty subject assignment. This identifies
        the exact subject, section, semester, and academic year.
      schema:
        type: string
        example: "ASG-001"


    StudentId:
      name: studentId
      in: path
      required: true
      description: Unique ID of the student.
      schema:
        type: string
        example: "202610897"


    Section:
      name: section
      in: query
      required: true
      description: Class section.
      schema:
        type: string
        example: "BSIT-3A"


    Semester:
      name: semester
      in: query
      required: true
      description: Academic semester.
      schema:
        type: string
        example: "1st Semester"


    AcademicYear:
      name: academicYear
      in: query
      required: true
      description: Academic year.
      schema:
        type: string
        example: "2026-2027"


    ScheduleId:
      name: scheduleId
      in: path
      required: true
      description: Unique ID of the schedule.
      schema:
        type: string
        example: "SCH-001"


    AnnouncementId:
      name: announcementId
      in: path
      required: true
      description: Unique ID of the announcement.
      schema:
        type: string
        example: "ANN-001"


  # ===========================================================================
  # SCHEMAS
  # ===========================================================================

  schemas:

    # =========================================================================
    # FACULTY
    # =========================================================================

    FacultyItem:
      type: object
      required:
      - facultyId
      - name
      - department
      - position
      - employmentType
      - employmentStatus

      properties:

        facultyId:
          type: string
          example: "FAC-2026-001"

        name:
          type: string
          example: "Maria Dela Cruz"

        email:
          type: string
          format: email
          example: "maria.delacruz@university.edu"

        department:
          type: string
          example: "Information Technology"

        position:
          type: string
          enum:
          - FACULTY
          - PROGRAM_HEAD
          - DEAN
          example: "DEAN"

        employmentType:
          type: string
