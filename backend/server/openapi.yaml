    # =========================================================================
    # ERROR
    # =========================================================================

    ErrorResponse:
      type: object
      description: >
        Problem Details response following the standard HTTP API error shape.
        The same structure is used for validation errors, authentication errors,
        authorization errors, missing resources, conflicts, and server errors.
      additionalProperties: true
      required:
      - type
      - title
      - status
      - detail
      properties:

        type:
          type: string
          format: uri-reference
          description: URI reference identifying the problem type.
          example: "https://example.com/problems/not-found"

        title:
          type: string
          description: Short, human-readable summary of the problem.
          example: "Not Found"

        status:
          type: integer
          format: int32
          description: HTTP status code generated for this occurrence of the problem.
          example: 404

        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
          example: "Faculty FAC-9999 was not found."

        instance:
          type: string
          description: URI reference identifying the specific occurrence of the problem.
          example: "/api/v1/faculty/FAC-9999"

      example:
        type: "https://example.com/problems/not-found"
        title: "Not Found"
        status: 404
        detail: "The requested faculty, subject, course, student, grade, schedule, or announcement was not found."
        instance: "/api/v1/faculty/FAC-9999"


